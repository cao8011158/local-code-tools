[project]
name = "agentic-trpg-local-code-tools"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "code-graph-rag[python-semantics,semantic]==0.6.30",
    "filelock>=3,<5",
    "markdown-it-py>=4,<5",
    "mcp>=2.3,<3",
    "qdrant-client==1.17.1",
]

[project.scripts]
lct = "lct.entrypoint:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lct"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
