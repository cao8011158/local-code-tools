[project]
name = "agentic-trpg-local-code-tools"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "usearch>=2.21,<3", "mcp>=1.26,<2", "jedi==0.19.2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
